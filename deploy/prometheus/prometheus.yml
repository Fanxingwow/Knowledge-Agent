global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: knowledge-agent
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/metrics/token
    static_configs:
      - targets:
          - api:8000
        labels:
          service: knowledge-agent
