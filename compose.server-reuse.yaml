name: ${COMPOSE_PROJECT_NAME:-knowledge-agent-server}

# Server deployment that reuses MinIO and Milvus already published by the
# Docker host. MongoDB and Redis remain project-owned and private to this
# Compose network so existing host services are not modified.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - backend
  logging: *default-logging

services:
  mongo-keyfile-init:
    image: ${ALPINE_IMAGE:-alpine:3.21.3}
    restart: "no"
    user: "0:0"
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${#MONGO_REPLICA_KEY}" -lt 32 ]; then
          echo "MONGO_REPLICA_KEY must contain at least 32 characters" >&2
          exit 1
        fi
        case "$${MONGO_REPLICA_KEY}" in
          *[!A-Za-z0-9+/=]*)
            echo "MONGO_REPLICA_KEY must be base64-compatible" >&2
            exit 1
            ;;
        esac
        umask 077
        printf '%s' "$${MONGO_REPLICA_KEY}" > /data/configdb/keyfile
        chown 999:999 /data/configdb/keyfile
        chmod 0400 /data/configdb/keyfile
    volumes:
      - mongo_config:/data/configdb
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  mongo:
    <<: *service-defaults
    image: ${MONGO_IMAGE:-mongo:7.0.37-jammy}
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    command:
      - mongod
      - --bind_ip_all
      - --port
      - "27017"
      - --replSet
      - ${MONGO_REPLICA_SET_NAME:-rs0}
      - --keyFile
      - /data/configdb/keyfile
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --host 127.0.0.1
          --port 27017
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  mongo-rs-init:
    image: ${MONGO_IMAGE:-mongo:7.0.37-jammy}
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HOME: /tmp
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-rs0}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-knowledge_base}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - >-
        exec mongosh --quiet
        --host mongo
        --port 27017
        --username "$${MONGO_INITDB_ROOT_USERNAME}"
        --password "$${MONGO_INITDB_ROOT_PASSWORD}"
        --authenticationDatabase admin
        /deploy/init-replica-set.js
    volumes:
      - ./deploy/mongo/init-replica-set.js:/deploy/init-replica-set.js:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  keycloak-db:
    <<: *service-defaults
    image: ${KEYCLOAK_POSTGRES_IMAGE:-postgres:17.6-alpine}
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  keycloak:
    <<: *service-defaults
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-enterprise-knowledge}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-enterprise-knowledge-console}
      CONSOLE_PUBLIC_ORIGIN: ${CONSOLE_PUBLIC_ORIGIN:?set CONSOLE_PUBLIC_ORIGIN}
      AUTH_TENANT_ID: ${AUTH_TENANT_ID:-enterprise-default}
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8081}:8080"
    expose:
      - "8080"
      - "9000"
    volumes:
      - ./deploy/keycloak/enterprise-knowledge-realm.json:/opt/keycloak/data/import/enterprise-knowledge-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g

  keycloak-realm-config:
    image: ${API_IMAGE:-knowledge-agent:server}
    entrypoint:
      - /usr/bin/tini
      - --
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    command:
      - python
      - scripts/keycloak_realm_admin.py
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-enterprise-knowledge}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REGISTRATION_ENABLED: ${KEYCLOAK_REGISTRATION_ENABLED:-false}
      KEYCLOAK_EMAIL_VERIFICATION_LIFESPAN_SECONDS: ${KEYCLOAK_EMAIL_VERIFICATION_LIFESPAN_SECONDS:-900}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-465}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-企业智能知识库问答}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-true}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-true}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-false}
      KEYCLOAK_SMTP_ALLOW_UTF8: ${KEYCLOAK_SMTP_ALLOW_UTF8:-false}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
      - /home/app:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    networks:
      - backend
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  mineru-gateway:
    <<: *service-defaults
    image: ${API_IMAGE:-knowledge-agent:server}
    command:
      - uvicorn
      - app.gateways.mineru_gateway:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-server-header
      - --timeout-keep-alive
      - "5"
      - --timeout-graceful-shutdown
      - "45"
    environment:
      IMPORT_WORK_ROOT: /tmp/imports
      HF_HOME: /tmp/huggingface
      MODELSCOPE_CACHE: /tmp/modelscope
      LOG_FILE_ENABLE: "false"
      MINERU_GATEWAY_AUTH_TOKEN: ${MINERU_GATEWAY_AUTH_TOKEN:-}
      MINERU_UPSTREAM_API_TOKEN: ${MINERU_UPSTREAM_API_TOKEN:-}
      MINERU_UPSTREAM_BASE_URL: ${MINERU_UPSTREAM_BASE_URL:-https://mineru.net/api/v4}
      MINERU_UPSTREAM_MODEL_VERSION: ${MINERU_UPSTREAM_MODEL_VERSION:-vlm}
      MINERU_GATEWAY_TOTAL_TIMEOUT_SECONDS: ${MINERU_GATEWAY_TOTAL_TIMEOUT_SECONDS:-540}
      MINERU_GATEWAY_MAX_CONCURRENCY: ${MINERU_GATEWAY_MAX_CONCURRENCY:-2}
      MINERU_GATEWAY_ALLOWED_DOWNLOAD_HOSTS: ${MINERU_GATEWAY_ALLOWED_DOWNLOAD_HOSTS:-.aliyuncs.com,.openxlab.org.cn,mineru.net}
    expose:
      - "8080"
    volumes:
      - api_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,uid=10001,gid=10001
      - /home/app:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8080/live",
              timeout=3,
          ).read()
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 60s
    init: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  api:
    <<: *service-defaults
    image: ${API_IMAGE:-knowledge-agent:server}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.10}
        UV_VERSION: ${UV_VERSION:-0.9.26}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.cloud.tencent.com}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-realm-config:
        condition: service_completed_successfully
      mineru-gateway:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROJECT_ROOT: /app
      IMPORT_WORK_ROOT: /var/lib/knowledge-agent/imports
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://127.0.0.1:8010}

      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY:-}
      AUTH_ALGORITHMS: ${AUTH_ALGORITHMS:-RS256}
      AUTH_DEV_TENANT_ID: ${AUTH_DEV_TENANT_ID:-local-dev}

      IMPORT_ENABLED: ${IMPORT_ENABLED:-false}
      IMPORT_REPOSITORY: ${IMPORT_REPOSITORY:-mongo}
      IMPORT_REQUIRE_IDEMPOTENCY_KEY: ${IMPORT_REQUIRE_IDEMPOTENCY_KEY:-true}
      IMPORT_WORKER_ENABLED: ${IMPORT_WORKER_ENABLED:-true}
      IMPORT_SHUTDOWN_GRACE_SECONDS: ${IMPORT_SHUTDOWN_GRACE_SECONDS:-30}

      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      CHAT_SSE_BROKER: ${CHAT_SSE_BROKER:-redis}

      MONGO_URL: "mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DATABASE:-knowledge_base}?authSource=${MONGO_APP_DATABASE:-knowledge_base}&replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}&retryWrites=true&w=majority"
      MONGO_DB_NAME: ${MONGO_APP_DATABASE:-knowledge_base}
      MONGO_REQUIRE_REPLICA_SET: ${MONGO_REQUIRE_REPLICA_SET:-true}

      REDIS_URL: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0"
      REDIS_CHAT_KEY_HMAC_SECRET: ${REDIS_CHAT_KEY_HMAC_SECRET:?set REDIS_CHAT_KEY_HMAC_SECRET}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-knowledge-agent:chat:v1}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?set MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?set MINIO_BUCKET_NAME}
      MINIO_SECURE: ${MINIO_SECURE:-false}

      MILVUS_URL: ${MILVUS_URL:?set MILVUS_URL}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_USERNAME: ${MILVUS_USERNAME:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
      CHUNKS_COLLECTION: ${CHUNKS_COLLECTION:-knowledge_agent_kb_chunks_v2}
      ITEM_NAME_COLLECTION: ${ITEM_NAME_COLLECTION:-knowledge_agent_kb_item_names_v2}
      IMPORT_PIPELINE_VERSION: ${IMPORT_PIPELINE_VERSION:-bge-m3.v1}
      MILVUS_ALLOW_SCHEMA_CREATE: ${MILVUS_ALLOW_SCHEMA_CREATE:-true}

      BGE_M3_PATH: /models/bge-m3
      BGE_M3: ${BGE_M3:-BAAI/bge-m3}
      BGE_DEVICE: ${BGE_DEVICE:-cpu}
      BGE_FP16: ${BGE_FP16:-false}
      BGE_RERANKER_LARGE: ${BGE_RERANKER_LARGE:-}
      BGE_RERANKER_DEVICE: ${BGE_RERANKER_DEVICE:-cpu}
      BGE_RERANKER_FP16: ${BGE_RERANKER_FP16:-false}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      VL_MODEL: ${VL_MODEL:-}
      MINERU_API_TOKEN: ${MINERU_GATEWAY_AUTH_TOKEN:-}
      MINERU_BASE_URL: ${MINERU_BASE_URL:-http://mineru-gateway:8080}

      HF_HOME: /var/cache/knowledge-agent/huggingface
      MODELSCOPE_CACHE: /var/cache/knowledge-agent/modelscope
      MODELSCOPE_OFFLINE: ${MODELSCOPE_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}

      LOG_CONSOLE_ENABLE: ${LOG_CONSOLE_ENABLE:-true}
      LOG_CONSOLE_LEVEL: ${LOG_CONSOLE_LEVEL:-INFO}
      LOG_FILE_ENABLE: ${LOG_FILE_ENABLE:-true}
      LOG_FILE_LEVEL: ${LOG_FILE_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_DIAGNOSE: ${LOG_DIAGNOSE:-false}

      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: /metrics
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?set METRICS_AUTH_TOKEN}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8010}:8000"
    volumes:
      - api_imports:/var/lib/knowledge-agent/imports
      - api_logs:/app/logs
      - api_cache:/var/cache/knowledge-agent
      - ${BGE_M3_HOST_PATH:-./deploy/models/bge-m3}:/models/bge-m3:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,uid=10001,gid=10001
      - /home/app:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health/ready",
              timeout=5,
          ).read()
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 120s
    stop_grace_period: 60s
    init: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  prometheus-init:
    image: ${ALPINE_IMAGE:-alpine:3.21.3}
    profiles:
      - observability
    restart: "no"
    user: "0:0"
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?set METRICS_AUTH_TOKEN}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${#METRICS_AUTH_TOKEN}" -lt 32 ]; then
          echo "METRICS_AUTH_TOKEN must contain at least 32 characters" >&2
          exit 1
        fi
        umask 077
        printf '%s' "$${METRICS_AUTH_TOKEN}" > /run/metrics/token
        chown -R 65532:65532 /run/metrics /prometheus
        chmod 0400 /run/metrics/token
    volumes:
      - prometheus_auth:/run/metrics
      - prometheus_data:/prometheus
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  prometheus:
    <<: *service-defaults
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1-distroless}
    profiles:
      - observability
    user: "65532:65532"
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_auth:/run/metrics:ro
      - prometheus_data:/prometheus
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  api_cache:
  api_imports:
  api_logs:
  mongo_config:
  mongo_data:
  prometheus_auth:
  prometheus_data:
  redis_data:
  keycloak_postgres_data:
